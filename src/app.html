<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<style>
			/* Painted before the app styles load, so no wrong background flashes. */
			html { background: #16140f; color: #ece5d6; }
			@media (prefers-color-scheme: light) { html { background: #f4efe4; color: #1f1c17; } }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
